<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>壱師アプリ再インストール</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>壱師アプリ</h1>
      <p>iPhone / Apple Watch 再インストール</p>
    </div>

    <div class="content">
      <div class="icon">📱⌚</div>

      <p class="description">
        壱師アプリ（日常アプリ）を選んだ端末に再インストールします。<br>
        数分かかります。完了するまでお待ちください。
      </p>

      <div class="connection-options">
        <label>
          <input type="radio" name="target" value="iphone" checked>
          iPhone
        </label>
        <label>
          <input type="radio" name="target" value="watch">
          Apple Watch
        </label>
        <label>
          <input type="radio" name="target" value="both">
          両方
        </label>
      </div>

      <div class="connection-options">
        <label>
          <input type="radio" name="connection" value="usb" checked>
          USB 接続
        </label>
        <label>
          <input type="radio" name="connection" value="wifi">
          WiFi 接続
        </label>
      </div>

      <button id="reinstallBtn" class="btn-primary">再インストール開始</button>

      <div id="status" class="status hidden">
        <div id="statusIcon" class="status-icon"></div>
        <p id="statusMessage"></p>
      </div>

      <div id="output" class="output hidden">
        <textarea id="outputText" readonly></textarea>
      </div>
    </div>

    <div class="footer">
      <p class="help-text">
        問題が発生した場合は、CLAUDE.md の手順を確認してください。
      </p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
