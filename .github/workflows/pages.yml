# apps/ の中の2つのアプリを GitHub Pages に公開する。
#
# 公開されるのは fridge / docs-tracker / トップページだけで、テストや設定ファイルは含めない。
# 初回だけ、リポジトリの Settings → Pages → Source を "GitHub Actions" にする操作が必要。
name: 日常アプリを公開

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 公開するファイルだけを集める
        run: |
          mkdir -p _site
          cp -r apps/fridge apps/docs-tracker _site/
          cp apps/index.html _site/index.html
          # Jekyll による加工を止める（そのままのファイルを配りたいため）
          touch _site/.nojekyll
          find _site -type f | sort

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
