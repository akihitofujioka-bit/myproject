# apps/ の中の2つのアプリを GitHub Pages に公開する。
#
# 公開されるのは fridge / docs-tracker / トップページだけで、テストや設定ファイルは含めない。
# Pages が未設定の場合は configure-pages の enablement で自動的に有効化を試みる。
# 権限などで自動化できなかった場合のみ、Settings → Pages → Source を "GitHub Actions" にする。
name: 日常アプリを公開

# 【一時停止中】自動実行を止めています。
#
# 理由: リポジトリで GitHub Pages が有効になっていないため、変更のたびに
#       この処理が失敗し（Get Pages site failed / Create Pages site failed）、
#       Actions が赤くなって本当の不具合が埋もれるため。
#       現在はネイティブアプリ（mobile/）で使っているので、公開は必須ではない。
#
# 再開する手順:
#   1. Settings → Pages → Source を「GitHub Actions」にする（管理者本人の操作が必要）
#   2. 下の push: の3行のコメントを外す
#   3. Actions の「日常アプリを公開」→「Run workflow」で1回手動実行する
#
# 停止中でも「Run workflow」からの手動実行はできます。
on:
  # push:
  #   branches: [main]
  #   paths:
  #     - "apps/**"
  #     - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 公開するファイルだけを集める
        run: |
          mkdir -p _site
          cp -r apps/fridge apps/docs-tracker apps/stock apps/kakeibo apps/cards apps/shared _site/
          cp apps/index.html _site/index.html
          # Jekyll による加工を止める（そのままのファイルを配りたいため）
          touch _site/.nojekyll
          find _site -type f | sort

      # enablement: true にすると、Pages が未設定のリポジトリでも
      # このワークフローから有効化を試みる（権限が足りない場合は手動設定が必要）
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
