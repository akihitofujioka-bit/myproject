# apps/ の中の2つのアプリを GitHub Pages に公開する。
#
# 公開されるのは fridge / docs-tracker / トップページだけで、テストや設定ファイルは含めない。
# Pages が未設定の場合は configure-pages の enablement で自動的に有効化を試みる。
# 権限などで自動化できなかった場合のみ、Settings → Pages → Source を "GitHub Actions" にする。
name: 日常アプリを公開

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 公開するファイルだけを集める
        run: |
          mkdir -p _site
          cp -r apps/fridge apps/docs-tracker apps/shared _site/
          cp apps/index.html _site/index.html
          # Jekyll による加工を止める（そのままのファイルを配りたいため）
          touch _site/.nojekyll
          find _site -type f | sort

      # enablement: true にすると、Pages が未設定のリポジトリでも
      # このワークフローから有効化を試みる（権限が足りない場合は手動設定が必要）
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
